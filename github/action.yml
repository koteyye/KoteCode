name: "KoteCode GitHub Action"
description: "Run KoteCode in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  version:
    description: "Exact KoteCode release version. Required when the action is pinned by commit SHA."
    required: false

  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/kotecode,/opencode,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Resolve KoteCode version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        VERSION="${INPUT_VERSION:-$ACTION_REF}"
        VERSION="${VERSION#v}"
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
          echo "Set input version when pinning KoteCode Action by commit SHA." >&2
          exit 1
        }
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache KoteCode
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.kotecode/bin
        key: kotecode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install KoteCode
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: >-
        curl -fsSL
        "https://raw.githubusercontent.com/koteyye/KoteCode/v${{ steps.version.outputs.version }}/install"
        | bash -s -- --version "${{ steps.version.outputs.version }}"
        --install-dir "$HOME/.kotecode/bin"

    - name: Add KoteCode to PATH
      shell: bash
      run: echo "$HOME/.kotecode/bin" >> $GITHUB_PATH

    - name: Run KoteCode
      shell: bash
      id: run_kotecode
      run: kotecode github run
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: "false"
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: "true"
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
