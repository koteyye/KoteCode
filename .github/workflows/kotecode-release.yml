name: KoteCode release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run SemVer (for example 0.1.0-test.1)"
        required: true
        default: "0.1.0-test.1"
        type: string

concurrency:
  group: kotecode-release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-runtime-cache
  KOTECODE_NPM_SCOPE: "@kotecode-ai"

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository and SemVer
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "koteyye/KoteCode"
          VERSION="${GITHUB_REF_TYPE:+$GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          fi
          bun run scripts/release/validate.ts "$VERSION"

      - name: Reject an existing GitHub Release or npm version
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists" >&2
            exit 1
          fi
          if npm view "kotecode@$VERSION" version >/dev/null 2>&1; then
            echo "npm package kotecode@$VERSION already exists" >&2
            exit 1
          fi

  test:
    name: Test ${{ matrix.package }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            directory: packages/core
            tests: true
          - package: opencode
            directory: packages/opencode
            tests: true
          - package: app
            directory: packages/app
            tests: true
          - package: desktop
            directory: packages/desktop
            tests: true
          - package: tui
            directory: packages/tui
            tests: true
          - package: client
            directory: packages/client
            tests: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: ${{ matrix.directory }}
        run: bun typecheck

      - name: Test
        if: matrix.tests
        working-directory: ${{ matrix.directory }}
        run: bun test --timeout 30000

  build-cli:
    name: CLI ${{ matrix.label }}
    needs:
      - validate
      - test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            baseline: true
            directory: kotecode-windows-x64-baseline
            binary: kotecode.exe
          - label: linux-x64
            runner: ubuntu-latest
            baseline: true
            directory: kotecode-linux-x64-baseline
            binary: kotecode
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            baseline: false
            directory: kotecode-linux-arm64
            binary: kotecode
          - label: darwin-arm64
            runner: macos-15
            baseline: false
            directory: kotecode-darwin-arm64
            binary: kotecode
          - label: darwin-x64
            runner: macos-15-intel
            baseline: true
            directory: kotecode-darwin-x64-baseline
            binary: kotecode
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile ${{ runner.os == 'Windows' && '--linker hoisted' || '' }}

      - name: Build native CLI
        shell: bash
        env:
          KOTECODE_VERSION: ${{ needs.validate.outputs.version }}
          KOTECODE_CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          args=(--single)
          if [ "${{ matrix.baseline }}" = "true" ]; then args+=(--baseline); fi
          bun run packages/opencode/script/build.ts "${args[@]}"

      - name: Smoke test version and help
        run: >-
          bun run scripts/release/smoke-cli.ts
          packages/opencode/dist/${{ matrix.directory }}/bin/${{ matrix.binary }}
          ${{ needs.validate.outputs.version }}

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Compress-Archive `
            -LiteralPath "packages/opencode/dist/${{ matrix.directory }}/bin/${{ matrix.binary }}" `
            -DestinationPath "staging/kotecode-${{ matrix.label }}.zip"

      - name: Package Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 "packages/opencode/dist/${{ matrix.directory }}/bin/${{ matrix.binary }}"
          mkdir -p staging
          (
            cd "packages/opencode/dist/${{ matrix.directory }}/bin"
            zip -9 "$GITHUB_WORKSPACE/staging/kotecode-${{ matrix.label }}.zip" "${{ matrix.binary }}"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: staging/kotecode-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 14

  build-desktop-windows:
    name: Desktop Windows x64
    needs:
      - validate
      - test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # tree-sitter-powershell falls back to node-gyp when its prebuilt binary
        # does not match the Windows runner. Hoisting exposes Bun's transitive
        # node-gyp binary to that install script.
        run: bun install --frozen-lockfile --linker hoisted

      - name: Prepare Desktop
        working-directory: packages/desktop
        env:
          KOTECODE_VERSION: ${{ needs.validate.outputs.version }}
          KOTECODE_CHANNEL: ${{ needs.validate.outputs.channel }}
          OPENCODE_CHANNEL: ${{ needs.validate.outputs.channel == 'latest' && 'prod' || 'beta' }}
        run: bun ./scripts/prepare.ts

      - name: Build Desktop
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: ${{ needs.validate.outputs.channel == 'latest' && 'prod' || 'beta' }}
        run: bun run build

      - name: Package unsigned NSIS and portable zip
        working-directory: packages/desktop
        timeout-minutes: 30
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          KOTECODE_VERSION: ${{ needs.validate.outputs.version }}
          KOTECODE_CHANNEL: ${{ needs.validate.outputs.channel }}
          KOTECODE_WINDOWS_SIGNING: "false"
          OPENCODE_CHANNEL: ${{ needs.validate.outputs.channel == 'latest' && 'prod' || 'beta' }}
        run: bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts

      - name: Smoke test Windows artifacts
        shell: pwsh
        run: |
          $setup = "packages/desktop/dist/KoteCode-desktop-windows-x64-setup.exe"
          $portable = "packages/desktop/dist/KoteCode-desktop-windows-x64-portable.zip"
          $blockmap = "$setup.blockmap"
          $metadata = "packages/desktop/dist/${{ needs.validate.outputs.channel }}.yml"
          foreach ($file in @($setup, $portable, $blockmap, $metadata)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing artifact: $file" }
          }
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne "NotSigned") {
            throw "v0.1.0 expects an unsigned Windows installer"
          }
          New-Item -ItemType Directory -Path portable-smoke | Out-Null
          Expand-Archive -LiteralPath $portable -DestinationPath portable-smoke
          if (-not (Test-Path -LiteralPath "portable-smoke/KoteCode.exe")) {
            throw "Portable archive does not contain KoteCode.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            packages/desktop/dist/KoteCode-desktop-windows-x64-setup.exe
            packages/desktop/dist/KoteCode-desktop-windows-x64-setup.exe.blockmap
            packages/desktop/dist/KoteCode-desktop-windows-x64-portable.zip
            packages/desktop/dist/${{ needs.validate.outputs.channel }}.yml
          if-no-files-found: error
          retention-days: 14

  build-desktop-linux:
    name: Desktop Linux x64
    needs:
      - validate
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Desktop
        working-directory: packages/desktop
        env:
          KOTECODE_VERSION: ${{ needs.validate.outputs.version }}
          KOTECODE_CHANNEL: ${{ needs.validate.outputs.channel }}
          OPENCODE_CHANNEL: ${{ needs.validate.outputs.channel == 'latest' && 'prod' || 'beta' }}
        run: bun ./scripts/prepare.ts

      - name: Build Desktop
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: ${{ needs.validate.outputs.channel == 'latest' && 'prod' || 'beta' }}
        run: bun run build

      - name: Package AppImage, deb, and rpm
        working-directory: packages/desktop
        timeout-minutes: 30
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          KOTECODE_VERSION: ${{ needs.validate.outputs.version }}
          KOTECODE_CHANNEL: ${{ needs.validate.outputs.channel }}
          KOTECODE_ARTIFACT_ARCH: x64
          OPENCODE_CHANNEL: ${{ needs.validate.outputs.channel == 'latest' && 'prod' || 'beta' }}
        run: bunx electron-builder --linux --x64 --publish never --config electron-builder.config.ts

      - name: Smoke test Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          appimage="packages/desktop/dist/KoteCode-desktop-linux-x64.AppImage"
          deb="packages/desktop/dist/KoteCode-desktop-linux-x64.deb"
          rpm_file="packages/desktop/dist/KoteCode-desktop-linux-x64.rpm"
          metadata="packages/desktop/dist/${{ needs.validate.outputs.channel }}-linux.yml"
          test -f "$appimage"
          test -f "$deb"
          test -f "$rpm_file"
          test -f "$metadata"
          chmod 755 "$appimage"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/kotecode-desktop
          find squashfs-root -name '*.desktop' -print -quit | grep .
          dpkg-deb --info "$deb" >/dev/null
          rpm -qip "$rpm_file" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            packages/desktop/dist/KoteCode-desktop-linux-x64.AppImage
            packages/desktop/dist/KoteCode-desktop-linux-x64.deb
            packages/desktop/dist/KoteCode-desktop-linux-x64.rpm
            packages/desktop/dist/${{ needs.validate.outputs.channel }}-linux.yml
          if-no-files-found: error
          retention-days: 14

  build-desktop-macos:
    name: Desktop macOS ${{ matrix.label }}
    needs:
      - validate
      - test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Intel
            runner: macos-15-intel
            arch: x64
          - label: Apple Silicon
            runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Desktop
        working-directory: packages/desktop
        env:
          KOTECODE_VERSION: ${{ needs.validate.outputs.version }}
          KOTECODE_CHANNEL: ${{ needs.validate.outputs.channel }}
          OPENCODE_CHANNEL: ${{ needs.validate.outputs.channel == 'latest' && 'prod' || 'beta' }}
        run: bun ./scripts/prepare.ts

      - name: Build Desktop
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: ${{ needs.validate.outputs.channel == 'latest' && 'prod' || 'beta' }}
        run: bun run build

      - name: Package unsigned DMG and zip
        working-directory: packages/desktop
        timeout-minutes: 30
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          KOTECODE_VERSION: ${{ needs.validate.outputs.version }}
          KOTECODE_CHANNEL: ${{ needs.validate.outputs.channel }}
          OPENCODE_CHANNEL: ${{ needs.validate.outputs.channel == 'latest' && 'prod' || 'beta' }}
        run: bunx electron-builder --mac --${{ matrix.arch }} --publish never --config electron-builder.config.ts

      - name: Smoke test macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          dmg="packages/desktop/dist/KoteCode-desktop-macos-${{ matrix.arch }}.dmg"
          archive="packages/desktop/dist/KoteCode-desktop-macos-${{ matrix.arch }}.zip"
          test -f "$dmg"
          test -f "$archive"
          hdiutil verify "$dmg"
          mkdir "macos-smoke-${{ matrix.arch }}"
          ditto -x -k "$archive" "macos-smoke-${{ matrix.arch }}"
          app="$(find "macos-smoke-${{ matrix.arch }}" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          test -x "$app/Contents/MacOS/KoteCode"
          if codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority='; then
            echo "v0.1.0 expects a macOS app without a Developer ID signature" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            packages/desktop/dist/KoteCode-desktop-macos-${{ matrix.arch }}.dmg
            packages/desktop/dist/KoteCode-desktop-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: Verify release bundle
    needs:
      - validate
      - build-cli
      - build-desktop-windows
      - build-desktop-linux
      - build-desktop-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts
          merge-multiple: true

      - name: Create and verify SHA256SUMS
        run: |
          bun run scripts/release/checksums.ts artifacts
          bun run scripts/release/verify-artifacts.ts artifacts "${{ needs.validate.outputs.channel }}"

      - name: Generate Homebrew Formula
        if: needs.validate.outputs.stable == 'true'
        run: bun run scripts/release/homebrew.ts "${{ needs.validate.outputs.version }}" artifacts/SHA256SUMS artifacts/Formula/kotecode.rb

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ needs.validate.outputs.tag }}
          path: |
            artifacts/*
            !artifacts/Formula/**
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: needs.validate.outputs.stable == 'true'
        with:
          name: homebrew-formula-${{ needs.validate.outputs.tag }}
          path: artifacts/Formula/kotecode.rb
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create draft GitHub Release
    if: github.event_name == 'push'
    needs:
      - validate
      - checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ needs.validate.outputs.tag }}
          path: artifacts

      - name: Create draft without overwriting assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$TAG"
            --draft
            --verify-tag
            --title "KoteCode $VERSION"
            --notes-file docs/RELEASE_NOTES.md
          )
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "${args[@]}" artifacts/*
