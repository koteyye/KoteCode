# KoteCode draft release workflow.
#
# Builds UNSIGNED single-binary CLI artifacts for the three primary platforms
# (Windows x64, Linux x64, macOS arm64) on manual dispatch, and uploads them to
# a draft GitHub Release. This is intentionally minimal for the alpha (ТЗ §11.2/§11.3):
#   - no code signing (Azure Trusted Signing / Apple codesign are out of scope)
#   - no npm / Homebrew / Scoop / Chocolatey publishing
#   - no desktop (Electron) build — that is a separate, larger pipeline
#
# Upstream OpenCode's publish.yml is far more elaborate (Blacksmith runners,
# Azure/Apple signing, Tauri keys, AUR, Docker). KoteCode does not inherit those
# credentials; see docs/BUILD.md for the rationale.

name: kotencode-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v (e.g. 0.1.0-alpha.1)."
        required: true
        default: "0.1.0-alpha.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build kotencode (${{ matrix.target.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { label: windows-x64, runner: windows-latest, platform: win32, arch: x64, archive: zip }
          - { label: linux-x64, runner: ubuntu-latest, platform: linux, arch: x64, archive: tar.gz }
          - { label: darwin-arm64, runner: macos-latest, platform: darwin, arch: arm64, archive: zip }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Typecheck
        run: bun typecheck
        working-directory: packages/core

      - name: Typecheck CLI
        run: bun typecheck
        working-directory: packages/opencode

      - name: Build single binary (current platform)
        run: bun run packages/opencode/script/build.ts --single
        env:
          KOTECODE_VERSION: ${{ inputs.version }}

      - name: Smoke test
        shell: bash
        run: |
          set -e
          BIN=$(ls packages/opencode/dist/kotencode-*/bin/kotencode* | head -1)
          echo "Binary: $BIN"
          "$BIN" --version

      - name: Archive artifact
        shell: bash
        run: |
          set -e
          DIR=$(ls -d packages/opencode/dist/kotencode-* | head -1)
          NAME="kotencode-${{ matrix.target.label }}"
          ROOT="$PWD"
          mkdir -p staging
          cd "$DIR/bin"
          if [ "${{ matrix.target.archive }}" = "tar.gz" ]; then
            tar -czf "$ROOT/staging/$NAME.tar.gz" .
          else
            zip -r "$ROOT/staging/$NAME.zip" .
          fi
          echo "ASSET=$NAME.${{ matrix.target.archive }}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotencode-${{ matrix.target.label }}
          path: staging/${{ env.ASSET }}

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la assets/
          gh release create "v${{ steps.ver.outputs.version }}" \
            --draft \
            --title "KoteCode ${{ steps.ver.outputs.version }}" \
            --notes "Draft release. Artifacts are UNSIGNED — see docs/BUILD.md." \
            assets/*
